services:
  polls:
    build: .
    container_name: polls
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATA_FILE=/app/data/data.json
      # Sæt SITE_PASSWORD i en .env-fil i samme mappe (git-ignoreres) for at låse
      # oprettelses-/admin-sider og poll-administration med kodeord.
      - SITE_PASSWORD=${SITE_PASSWORD:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
